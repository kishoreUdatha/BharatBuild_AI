# ============================================
# BharatBuild AI - alternate host port mapping
# ============================================
# The default host ports (3000, 8000, 5433) are occupied by other stacks on
# this machine. This override shifts only the HOST side of each mapping;
# container-internal ports are unchanged, so next.config.js's rewrite to
# http://backend:8000 still resolves inside the compose network.
#
#   docker compose -p bharatbuild_ai \
#     -f docker-compose.local.yml -f docker-compose.local.ports.yml up -d
#
#   frontend  http://localhost:3001
#   backend   http://localhost:8001/docs
#   postgres  localhost:5434
#   redis     localhost:6380
#   mailpit   http://localhost:8025

services:
  postgres:
    ports: !override
      - "5434:5432"

  backend:
    ports: !override
      - "8001:8000"
    environment:
      - CORS_ORIGINS_STR=http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000

  frontend:
    ports: !override
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://${LAN_HOST:-localhost}:8001/ws
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
