# ============================================
# BharatBuild AI - Local development stack
# ============================================
# Frontend + Backend + Postgres + Redis, all in Docker, with hot reload.
#
#   docker compose -p bharatbuild_ai -f docker-compose.local.yml up -d
#
# Runs under project name `bharatbuild_ai` so it attaches to the SAME
# postgres/redis volumes the existing docker-compose.yml stack created -
# your local data is preserved.
#
# Differences from docker-compose.yml (which targets deployment):
#   - backend uses Dockerfile.light (fast build, no PyTorch/TF) and overrides
#     DATABASE_URL/REDIS_URL, which .env points at localhost and so cannot
#     resolve from inside a container
#   - frontend runs `next dev` instead of the production build, because
#     NEXT_PUBLIC_* values are inlined at build time and the production
#     Dockerfile bakes in the bharatbuild.ai URLs
#   - MinIO is omitted: .env sets STORAGE_MODE=local / USE_MINIO=False

services:
  postgres:
    image: postgres:15-alpine
    container_name: bharatbuild_postgres
    environment:
      POSTGRES_USER: bharatbuild
      POSTGRES_PASSWORD: bharatbuild123
      POSTGRES_DB: bharatbuild_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatbuild"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bharatbuild_network

  redis:
    image: redis:7-alpine
    container_name: bharatbuild_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bharatbuild_network

  mailpit:
    # Catches outbound mail locally so the email delivery path can be tested
    # for real. Nothing leaves the machine: it accepts SMTP on 1025 and shows
    # what arrived at http://localhost:8025.
    image: axllent/mailpit:latest
    container_name: bharatbuild_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - bharatbuild_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.light
    container_name: bharatbuild_backend
    env_file:
      - .env
    environment:
      # .env points these at localhost, which is the host - not reachable
      # from inside the container. Override with the compose service names.
      - DATABASE_URL=postgresql+asyncpg://bharatbuild:bharatbuild123@postgres:5432/bharatbuild_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - ENVIRONMENT=development
      - DEBUG=True
      # Mail: with EMAIL_PROVIDER=resend in .env real email goes out through
      # Resend. Comment that out and these send to the local catcher instead
      # (http://localhost:8025), which never leaves the machine.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_USE_TLS=False
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      # The academic file store lives under /app/uploads. A named volume, not
      # the bind mount above: inside ./backend it would land in the repository
      # and be wiped by a rebuild.
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - bharatbuild_network

  frontend:
    image: node:18-alpine
    container_name: bharatbuild_frontend
    working_dir: /app
    environment:
      # Relative on purpose: Next rewrites /api/v1/* to the backend, so the
      # browser talks to whatever host it loaded the page from. That is what
      # lets one tunnel URL serve the whole app with no CORS entry.
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-/api/v1}
      - NEXT_PUBLIC_WS_URL=ws://${LAN_HOST:-localhost}:8000/ws
      - NEXT_PUBLIC_APP_URL=http://${LAN_HOST:-localhost}:3000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes so the host's Windows-built node_modules and .next
      # never leak into the Linux container.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: sh -c "npm ci --no-audit --no-fund || npm install --no-audit --no-fund; npm run dev"
    networks:
      - bharatbuild_network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  bharatbuild_network:
    driver: bridge
